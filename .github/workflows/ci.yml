# CI for looot-cookbook. Not enabled: GitHub Actions stay off until the owner turns them on.
# Once on, add a push trigger and a weekly schedule so catalog drift shows up.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/leak-scan.sh .
      - run: python3 tests/check_recipes.py
